  <g id="text_20">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(220.671479 551.094565)">UFGIR = soyageing + soygene + soyglobal + soylocal + cotton; FGIR = all other datasets.</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(183.432963 562.497162)">Within each stratum: mean of available uniquely matched dataset ratios. Dataset counts vary by stratum.</text>
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #444444" transform="translate(210.355072 573.89976)">At least 2 datasets per group required; no missing-baseline imputation or confidence intervals.</text>
